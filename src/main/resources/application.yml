spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3307/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    error:
      include-message: always
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
