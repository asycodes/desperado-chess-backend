spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/desperado}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    error:
      include-message: always
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

desperado:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  match:
    length: 10m
    move-timeout: 60s
    bot-think-time: 2s
    bot-cooldown: 4s

server:
  port: ${PORT:8080}